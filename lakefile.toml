name = "lasm_todomvc"
version = "0.1.0"
defaultTargets = ["app"]
testDriver = "Tests"

[[require]]
name = "LLMClient"
git = "https://github.com/paulbutcher/lean-llmclient"
rev = "v0.12.0"

[[require]]
name = "markdown"
git = "https://github.com/paulbutcher/lean-markdown"
rev = "v0.9.0"

# The model and update, with proofs (Todo.lean).
[[lean_lib]]
name = "Todo"
roots = ["Todo", "Markdown", "ChatTools", "Chat"]

# Theorems about the above, and tests; building them is passing.
[[lean_lib]]
name = "Tests"
globs = ["Tests.+"]

# The program: Main.lean. Lasm builds it with `lasm build Main.lean`.
[[lean_exe]]
name = "app"
root = "Main"
